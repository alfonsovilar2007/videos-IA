<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#F4EFE6;font-family:"DejaVu Sans",sans-serif}
</style></head><body>
<svg id="s" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="personajes.js"></script>
<script>
const s=document.getElementById('s');
let h='';
const add=x=>h+=x;
// fondo y titulo
add(`<rect width="1600" height="1000" fill="#F4EFE6"/>`);
add(`<text x="60" y="78" font-size="40" font-weight="700" fill="${INK}">Boceto de personajes · "La ventana que partió dos aviones"</text>`);
add(`<text x="60" y="118" font-size="22" fill="#5B6478">Diseño propio: cabeza de judía color crema · contorno azul marino · brazos y piernas "fideo" · coloretes · una prenda que dice quién es</text>`);
// paneles
[[40,150,560,800],[620,150,500,800],[1140,150,420,800]].forEach(([x,y,w,hh])=>add(`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="28" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="3"/>`));
// PROTAGONISTA: ingeniera/o
add(personaje(320,880,1.25,{expr:'neutral',pantalon:'#3C4A63',torso:'#FAFAF7',manga:'#FAFAF7',
  brazoI:'M-46,-250 q-40,60 -44,112', brazoD:'M46,-250 q44,30 70,-20',
  manos:[[-90,-136],[116,-272]],
  detalle:`<path d="M0,-266 l-14,40 14,70 14,-70z" fill="#5B8BD9" stroke="${INK}" stroke-width="5"/><rect x="22" y="-238" width="22" height="26" rx="4" fill="#E9E4DA" stroke="${INK}" stroke-width="4"/><path d="M28,-246 l0,22 M36,-248 l0,22" stroke="#D9534F" stroke-width="4"/>`,
  objeto:`<g transform="translate(116,-272) rotate(-20)"><rect x="-6" y="-60" width="12" height="60" rx="3" fill="#F2C14E" stroke="${INK}" stroke-width="4"/><path d="M-6,-60 l6,-14 6,14z" fill="#E8B07A" stroke="${INK}" stroke-width="4"/></g>`,
  cabeza:PELO+GAFAS}));
add(`<text x="70" y="200" font-size="30" font-weight="700" fill="${INK}">PROTAGONISTA · Toni</text>`);
add(`<text x="70" y="234" font-size="20" fill="#5B6478">Ingeniero: bata, gafas y lápiz. Investiga la grieta.</text>`);
// SECUNDARIOS
add(personaje(760,880,0.95,{expr:'neutral',pantalon:'#55463A',torso:'#7A6450',manga:'#7A6450',
  brazoI:'M-46,-250 q-30,60 -34,112', brazoD:'M46,-250 q30,60 34,112', manos:[[-80,-136],[80,-136]],
  detalle:`<path d="M0,-266 l-10,30 10,40 10,-40z" fill="#C0392B" stroke="${INK}" stroke-width="4"/>`,
  cabeza:SOMBRERO}));
add(personaje(990,880,0.95,{expr:'eureka',pantalon:'#22355E',torso:'#22355E',manga:'#22355E',
  brazoI:'M-46,-250 q-30,60 -34,112', brazoD:'M46,-250 q50,-10 60,-80', manos:[[-80,-136],[106,-330]],
  detalle:`<path d="M-40,-240 h80" stroke="#F2C14E" stroke-width="5"/><circle cx="-26" cy="-200" r="5" fill="#F2C14E"/><circle cx="-26" cy="-175" r="5" fill="#F2C14E"/>`,
  cabeza:GORRA}));
add(`<text x="650" y="200" font-size="30" font-weight="700" fill="${INK}">SECUNDARIOS</text>`);
add(`<text x="650" y="234" font-size="20" fill="#5B6478">Pasajero años 50 · Piloto del Comet</text>`);
// EXPRESIONES
add(`<text x="1170" y="200" font-size="30" font-weight="700" fill="${INK}">EXPRESIONES</text>`);
const ex=[['neutral','Normal'],['sorprendido','Sorpresa'],['preocupado','Preocupado'],['eureka','¡Eureka!']];
ex.forEach(([e,t],i)=>{const cx=1250+(i%2)*200, cy=360+Math.floor(i/2)*320;
  add(head(cx,cy,1.05,e,PELO+GAFAS));
  add(`<text x="${cx}" y="${cy+130}" font-size="22" text-anchor="middle" fill="${INK}" font-weight="700">${t}</text>`);});
add(`<text x="1170" y="925" font-size="18" fill="#5B6478">Las cejas llevan toda la emoción.</text>`);
s.innerHTML=h;
</script></body></html>
