const CLAVE = new Set(['Halifax', 'Canadá', '1917', 'francés', 'Mont-Blanc', 'explosivos', 'guerra', 'chocó', 'arder', 'huyó', 'remando', 'gente', 'mirar', 'incendio', '20', 'minutos', 'estalló', 'onda', 'arrasó', 'ciudad', '2.000', '9.000', 'heridos', 'ancla', '3', 'kilómetros', 'cielo']);

{ const g = granoCanvas.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

  const g = $('gancho'); const kg = (t - .1) / .2; g.style.opacity = t < FIN_GANCHO && t > .08 ? 1 : 0; g.style.transform = `scale(${lerp(1.15, 1, salida(kg)) * (1 + Math.sin(clamp(kg) * Math.PI) * .03)})`;
