// Jaula de hierro (mortsafe) sobre una tumba

  for (let z = -LA / 2; z <= LA / 2 + .001; z += .16) { barra(-A / 2, z); barra(A / 2, z); }
  for (const [x, z] of [[-A / 2, -LA / 2], [A / 2, -LA / 2], [-A / 2, LA / 2], [A / 2, LA / 2]]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.05, .06, AL + .2, 10), m); p.position.set(x, (AL + .2) / 2, z); p.castShadow = true; g.add(p);

// =================== ESCENARIO 1: EL CEMENTERIO ===================
function crearCementerio() {

  const uni = { arriba: { value: new THREE.Color() }, horizonte: { value: new THREE.Color() } };
  e.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: uni,

  }

  const tierraTex = canvasTex(256, 256, (g, w, h) => ruido(g, w, h, '#4a3524', .25, 8000));
  const monticulo = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ map: tierraTex, roughness: 1 })); monticulo.scale.set(.6, .18, 1.1); e.add(monticulo);
  // tumba abierta (para los ladrones)

  const hoyo = new THREE.Mesh(new THREE.BoxGeometry(1.2, .05, 2.2), new THREE.MeshBasicMaterial({ color: '#050403' })); hoyo.position.copy(TA).setY(.03); e.add(hoyo);
  const monton = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ map: tierraTex, roughness: 1 })); monton.scale.set(.9, .55, 1.3); monton.position.copy(TA).add(v3(1.5, 0, 0)); monton.castShadow = true; e.add(monton);
  const tapa = new THREE.Mesh(new THREE.BoxGeometry(.7, .08, 1.9), new THREE.MeshStandardMaterial({ color: '#5a3a22', roughness: .7 })); tapa.position.copy(TA).add(v3(-1.1, .25, .2)); tapa.rotation.z = .5; tapa.castShadow = true; e.add(tapa);

const golpes = [0, T(62) - .06 + .625 * (T(67) - T(62)), T(85) - .06 + .5 * (T(87) - T(85)) / 1.15];
// grano de película animado (evita bandas en los degradados oscuros)

{ const g = granoCanvas.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

function edicion(t) {
  const g = $('gancho'); const kg = t / .22; g.style.opacity = t < FIN_GANCHO ? 1 : 0; g.style.transform = `scale(${lerp(1.1, 1, salida(kg)) * (1 + Math.sin(clamp(kg) * Math.PI) * .03)})`;

  let sx = 0, sy = 0; for (const gp of golpes) { const d = t - gp; if (d >= 0 && d < .4) { const a = (1 - d / .4) * 22; sx += Math.sin(d * 90) * a; sy += Math.cos(d * 77) * a; } }
  sx += barrido * barrido * 260;
