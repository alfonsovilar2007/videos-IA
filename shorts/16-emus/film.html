  for (const i of [13, 19, 26, 30, 33, 37, 49, 55, 64, 70, 78, 81, 88, 93, 97, 108, 117]) { const d = t - T(i); if (d >= 0 && d < .3) escala = Math.max(escala, lerp(1.06, 1, salida(d / .3))); }
  barrido = Math.max(barrido, clamp((t - (DURACION - .2)) / .2));
  let sx = 0, sy = 0; for (const [gp, fuerza] of golpes) { const d = t - gp; if (d >= 0 && d < .6) { const a = Math.pow(1 - d / .6, 2) * fuerza; sx += Math.sin(d * 90) * a; sy += Math.cos(d * 77) * a; } }
  if (t < T(10) || (t > T(56) && t < T(62) + .3)) { sx += Math.sin(t * 70) * 4; sy += Math.cos(t * 63) * 3; }
  sx += barrido * barrido * 280;
  const lz = $('lienzo'); lz.style.transform = `translate(${sx}px,${sy}px) scale(${escala * 1.04})`; lz.style.filter = barrido > 0 ? `blur(${(barrido * 10).toFixed(1)}px)` : 'none';
  $('grano').style.backgroundPosition = `${Math.floor(t * 30 * 97) % 256}px ${Math.floor(t * 30 * 53) % 256}px`;
}

window.DURACION = DURACION;
window.PLANOS = PLANOS.map(p => ({ nombre: p.nombre, t0: p.t0, t1: p.t1, desde: p.desde }));
window.renderAt = (t) => {
  const p = PLANOS.find(p => t >= p.t0 && t < p.t1) || PLANOS[PLANOS.length - 1];
  const k = clamp((t - p.t0) / (p.t1 - p.t0));
  FOCO = null; p.f(k, t); p.f(k, t);
  const c = campo.cam; c.aspect = W / H; c.updateProjectionMatrix(); c.updateMatrixWorld();
  rp.scene = campo.escena; rp.camera = c; dof.escena = campo.escena; dof.cam = c;
  if (FOCO) { dof.foco = -FOCO.clone().applyMatrix4(c.matrixWorldInverse).z; dof.apertura = .003; } else dof.apertura = 0;
  renderer.toneMappingExposure = 1.0;
  if (window.ANTES) window.ANTES(t);
  comp.render(); edicion(t);
};
await Promise.all(CARGAS);
window.LISTO = true;
</script>
