PLANOS.forEach((p, i) => { p.t0 = i === 0 ? 0 : T(p.desde) - .06; });

const BARRIDOS = new Set([10, 40, 61, 87]);

for (let i = 0; i < frases.length; i++) if (frases[i].length === 1) {
  const prev = frases[i - 1], ant = prev && prev[0].quien === frases[i][0].quien && !/[.:…!?]$/.test(prev[prev.length - 1].w);
  if (ant) { prev.push(...frases[i]); frases.splice(i, 1); i--; } else if (frases[i + 1] && frases[i + 1][0].quien === frases[i][0].quien) { frases[i + 1].unshift(...frases[i]); frases.splice(i, 1); i--; }
}
const bloques = [];
frases.forEach(fr => { const n = fr.length, k = Math.ceil(n / 4); let i = 0; for (let b = 0; b < k; b++) { const tam = Math.floor(n / k) + (b < n % k ? 1 : 0); bloques.push(fr.slice(i, i + tam)); i += tam; } });
const CLAVE = new Set(['Milwaukee', '1912', 'Theodore', 'Roosevelt', 'expresidente', 'revólver', 'disparó', 'pecho', 'bala', '50', 'páginas', 'bolsillo', 'funda', 'metálica', 'gafas', 'agujereados', 'alce', '84', 'minutos', 'nunca', 'vida', 'hablando']);
const marcar = w => w.split(' ').map(p => CLAVE.has(p.replace(/[^\wáéíóúñü0-9]/gi, '')) ? `<b>${p}</b>` : p).join(' ');
const FIN_GANCHO = T(INICIO_SUB) - .06;

// =================== EDICIÓN ===================
const $ = id => document.getElementById(id);
const golpes = [T(6) + .1, T(36), T(54) - .06 + .4 * (T(61) - T(54))];
const granoCanvas = document.createElement('canvas'); granoCanvas.width = granoCanvas.height = 256;
{ const g = granoCanvas.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
$('grano').style.backgroundImage = `url(${granoCanvas.toDataURL()})`;
function edicion(t) {
  const g = $('gancho'); const kg = t / .2; g.style.opacity = t < FIN_GANCHO ? 1 : 0; g.style.transform = `scale(${lerp(1.1, 1, salida(kg)) * (1 + Math.sin(clamp(kg) * Math.PI) * .03)})`;
  const sub = $('sub');
  const b = t >= FIN_GANCHO ? bloques.find((bl, i) => bl[0].t0 - .05 <= t && t < (bloques[i + 1]?.[0].t0 ?? DURACION) - .05) : null;
  if (b) { sub.innerHTML = marcar(b.map(u => u.w.replace('…', '...')).join(' ')); sub.className = 'txt' + (b[0].quien !== 'narrador' ? ' personaje' : ''); const k = clamp((t - b[0].t0) / .1); sub.style.transform = `scale(${lerp(1.18, 1, salida(k))})`; sub.style.opacity = 1; } else sub.style.opacity = 0;
  $('flash').style.opacity = [[T(6) + .1, .55], [T(36), .6], [golpes[2], .35]].reduce((a, [ti, f]) => Math.max(a, t >= ti ? f * clamp(1 - (t - ti) / .18) : 0), 0);
  let escala = 1, barrido = 0; for (const p of PLANOS) { const d = t - p.t0; if (d >= 0 && d < .25) { escala = Math.max(escala, lerp(1.07, 1, salida(d / .25))); if (BARRIDOS.has(p.desde) && d < .18) barrido = 1 - d / .18; } }
  let sx = 0, sy = 0; for (const gp of golpes) { const d = t - gp; if (d >= 0 && d < .45) { const a = (1 - d / .45) * 26; sx += Math.sin(d * 90) * a; sy += Math.cos(d * 77) * a; } }
  sx += barrido * barrido * 260;
  const lz = $('lienzo'); lz.style.transform = `translate(${sx}px,${sy}px) scale(${escala * 1.03})`; lz.style.filter = barrido > 0 ? `blur(${(barrido * 10).toFixed(1)}px)` : 'none';
  $('grano').style.backgroundPosition = `${Math.floor(t * 30 * 97) % 256}px ${Math.floor(t * 30 * 53) % 256}px`;
}

window.DURACION = DURACION;
