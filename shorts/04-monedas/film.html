// =================== ESCENARIO 2: CUARTO DEL LIMADOR (noche) ===================
function crearNoche() {

// =================== ESCENARIO 3: MERCADO ===================
function crearMercado() {

  for (let i = 0; i < 14; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(.22, 12, 8), new THREE.MeshStandardMaterial({ color: ['#E0442F', '#F2A33A', '#7ED957'][i % 3] })); f.position.set(-3 + (i % 7) * .35, 2.2, -.4 + Math.floor(i / 7) * .35); e.add(f); }
  // balanza
  const oro = new THREE.MeshStandardMaterial({ color: '#D9A93A', metalness: .9, roughness: .3, envMap: entorno });
  const bal = new THREE.Group(); bal.position.set(1.4, 2, .2); e.add(bal);
  const poste = new THREE.Mesh(new THREE.CylinderGeometry(.06, .1, 1.8, 12), oro); poste.position.y = .9; bal.add(poste);
  const viga = new THREE.Group(); viga.position.y = 1.8; bal.add(viga);
  const barra = new THREE.Mesh(new THREE.BoxGeometry(2.2, .06, .06), oro); viga.add(barra);
  const platos = [-1, 1].map(s => { const p = new THREE.Mesh(new THREE.CylinderGeometry(.42, .3, .1, 24), oro); e.add(p); p.userData.s = s; return p; });
  const moneda = crearMoneda('plata'); moneda.userData.canto.dibujar(0); moneda.scale.setScalar(.25); e.add(moneda);
  const mer = { normal: personaje(e, 'mercader', 4.0), feliz: personaje(e, 'mercader_feliz', 4.0) };
  e.add(new THREE.HemisphereLight('#dff0ff', '#8a6a4a', 1.0));
  const sol = new THREE.DirectionalLight('#fff3d8', 3); sol.position.set(8, 14, 8); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 }); sol.shadow.camera.updateProjectionMatrix(); e.add(sol);
  const cam = new THREE.PerspectiveCamera(46, W / H, .05, 200);
  return {
    escena: e, cam, bal,
    preparar({ tiempo, inclina = 0, feliz = false }) {
      viga.rotation.z = -inclina * .25;
      platos.forEach(p => { const x = p.userData.s * 1.05, y = 1.8 - p.userData.s * Math.sin(-inclina * .25) * 1.05; p.position.set(bal.position.x + x, bal.position.y + y - .55, bal.position.z); });
      moneda.position.copy(platos[0].position).add(v3(0, .1, 0)); moneda.rotation.set(-Math.PI / 2 + .15, 0, 0);
      mer.normal.visible = !feliz; mer.feliz.visible = feliz;
      for (const m of Object.values(mer)) { m.position.set(-1.2, 0, -1.3); mirar(m, cam); }
    },
  };
}

// =================== ESCENARIO 4: CASA DE LA MONEDA ===================
function crearCeca() {
  const e = new THREE.Scene(); e.environment = entorno; e.background = fondoDegradado('#3b1b6e', '#ff8a4a');
  const caja = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; e.add(o); return o; };
  const piedra = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#5e5a66'; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 * 32; x < w; x += 64) { g.fillStyle = `rgb(${165 + rnd() * 30},${155 + rnd() * 25},${150 + rnd() * 25})`; g.fillRect(x + 3, y + 3, 58, 26); } }, 6, 4);
  caja(60, .2, 40, new THREE.MeshStandardMaterial({ color: '#6a6470', roughness: .9 }), 0, -.1, 0);
  caja(24, 14, 1, new THREE.MeshStandardMaterial({ map: piedra, roughness: .85 }), 0, 7, -5);
  caja(26, 1, 2, new THREE.MeshStandardMaterial({ color: '#cfc8d4' }), 0, 14, -4.6);
  const columnas = new THREE.MeshStandardMaterial({ color: '#e6e0ea', roughness: .6 });

  const cartel = new THREE.Mesh(new THREE.PlaneGeometry(9, 1.3), new THREE.MeshStandardMaterial({ map: canvasTex(1024, 150, (g, w, h) => { g.fillStyle = '#1F2A44'; g.fillRect(0, 0, w, h); g.fillStyle = '#F2C14E'; g.font = 'bold 96px DejaVu Sans'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('ROYAL MINT', w / 2, h / 2 + 4); }), emissive: '#fff', emissiveIntensity: .15 })); cartel.position.set(0, 11, -4.45); e.add(cartel);
  // puertas
  const madera = new THREE.MeshStandardMaterial({ color: '#6B3A1E', roughness: .6 });
  const pI = new THREE.Group(), pD = new THREE.Group(); pI.position.set(-1.8, 0, -4.4); pD.position.set(1.8, 0, -4.4); e.add(pI, pD);

  const luzPuerta = new THREE.PointLight('#ffc060', 0, 14, 1.4); luzPuerta.position.set(0, 3, -3); e.add(luzPuerta);
  for (const x of [-4.6, 4.6]) { const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: texRadial('rgba(255,190,80,1)'), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); f.position.set(x, 4.2, -3.8); f.scale.setScalar(1.6); e.add(f); const l = new THREE.PointLight('#ffb050', 20, 10, 1.5); l.position.set(x, 4.2, -3.4); e.add(l); }
  // reja que cae
  const reja = new THREE.Group(); e.add(reja);
  const hierro = new THREE.MeshStandardMaterial({ color: '#2c2f36', metalness: .8, roughness: .4 });
  for (let i = 0; i < 9; i++) { const b = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, 5, 8), hierro); b.position.set(-1.6 + i * .4, 2.5, 0); b.castShadow = true; reja.add(b); }
  for (const y of [.3, 4.7]) { const b = new THREE.Mesh(new THREE.BoxGeometry(3.6, .18, .18), hierro); b.position.y = y; reja.add(b); }
  const P = { newton: personaje(e, 'newton', 4), newtonE: personaje(e, 'newton_eureka', 4), fals: personaje(e, 'falsificador', 4), falsP: personaje(e, 'falsificador_pillado', 4) };
  e.add(new THREE.HemisphereLight('#ffd0b0', '#2a1a40', .9));
  const sol = new THREE.DirectionalLight('#ffb070', 2.4); sol.position.set(10, 8, 12); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 }); sol.shadow.camera.updateProjectionMatrix(); e.add(sol);
  const cam = new THREE.PerspectiveCamera(46, W / H, .05, 200);
  return {
    escena: e, cam,
    preparar({ tiempo, puerta = 0, quienes = [], reja: kr = null }) {
      pI.rotation.y = -puerta * 1.6; pD.rotation.y = puerta * 1.6; luzPuerta.intensity = puerta * 60;
      for (const k in P) P[k].visible = false;
      quienes.forEach(([k, pos]) => { P[k].visible = true; P[k].position.copy(pos); mirar(P[k], cam); });
      reja.visible = kr !== null; if (kr !== null) { reja.position.set(3.2, lerp(7, 0, Math.pow(clamp(kr), 2)), 1.2); }

  };
}

const macro = crearMacro(), noche = crearNoche(), mercado = crearMercado(), ceca = crearCeca();
const comp = new EffectComposer(renderer);
const rp = new RenderPass(macro.escena, macro.cam); comp.addPass(rp);
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), .3, .5, .9); comp.addPass(bloom); comp.addPass(new OutputPass());

// =================== PLANOS ===================
const cam = (c, pos, mira, fov) => { c.fov = fov; c.position.copy(pos); c.lookAt(mira); };
// moneda de canto girando (para gancho y final, el mismo encuadre = bucle)
// giro de la moneda: el canto mira a cámara. tl = tiempo desde el inicio del bucle (negativo al final del vídeo)
// la moneda rueda sobre su propio eje y la cámara mira el canto: las rayas pasan por delante
const giroCanto = tl => tl * 1.1;
const MACRO_CANTO = (t, tl, conLima, k, lejos = 0) => {
  macro.preparar({ tiempo: t, visibles: { oro: [0, 0, 0, 0, 0, giroCanto(tl)] }, lima: conLima ? [1.02, .05 + Math.sin(t * 22) * .04, 0, -.1] : null, chispasK: conLima ? t : -1 });
  cam(macro.cam, v3(lerp(2.0, 1.8, k) + lejos, .45, lerp(1.15, 1.0, k) + lejos * .5), v3(.85, .05, 0), 40);
};
const PLANOS = [
  { desde: 0, nombre: 'GANCHO: lima rascando el canto con rayas, chispas', esc: 'macro', f(k, t) { MACRO_CANTO(t, t, true, k); } },

      cam(macro.cam, v3(lerp(1.5, 1.4, k), lerp(1.5, 1.3, k), lerp(.9, .7, k)), v3(.9, 0, 0), 40);
    } },
  { desde: 8, nombre: 'antes, una moneda de plata: la balanza', esc: 'mercado', f(k, t) {
      mercado.preparar({ tiempo: t, inclina: salida(k * 1.5) });
      cam(mercado.cam, v3(lerp(3.2, 2.6, k), lerp(3.6, 3.4, k), lerp(5.5, 4.6, k)), v3(1.4, 3.2, .2), 44);
    } },
  { desde: 13, nombre: 'valía la plata que llevaba dentro: moneda brillante girando', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, visibles: { lisa: [0, 0, 0, t * 1.4, .2] } });
      cam(macro.cam, v3(lerp(-.5, .5, k), lerp(.3, .6, k), lerp(4.6, 4.0, k)), v3(0, 0, 0), 40);
    } },
  { desde: 19, nombre: 'había quien limaba: el limador a la luz de la vela', esc: 'noche', f(k, t) {
      noche.preparar({ tiempo: t });
      cam(noche.cam, v3(lerp(-1.2, -.6, k), lerp(3.6, 3.4, k), lerp(5.6, 4.8, k)), v3(.3, 3.0, -.8), 46);
    } },
  { desde: 26, nombre: 'el borde antes de gastarla: lima sobre moneda lisa', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, visibles: { lisa: [0, 0, 0, t * .7, .35] }, lima: [1.02, .05, 0, -.12 + Math.sin(t * 22) * .05], chispasK: t });
      cam(macro.cam, v3(lerp(2.0, 1.6, k), lerp(-.3, .2, k), lerp(2.4, 2.1, k)), v3(.8, 0, 0), 40);
    } },
  { desde: 31, nombre: 'nadie lo notaba: el mercader feliz', esc: 'mercado', f(k, t) {

      cam(mercado.cam, v3(lerp(.6, .2, k), lerp(3.4, 3.3, k), lerp(5.4, 4.8, k)), v3(-.4, 3.0, -.6), 46);
    } },
  { desde: 34, nombre: 'miles de virutas: el tarro se llena', esc: 'noche', f(k, t) {
      noche.preparar({ tiempo: t, llenado: salida(k) });
      cam(noche.cam, v3(lerp(-2.4, -2.2, k), lerp(4.2, 4.0, k), lerp(4.6, 4.0, k)), v3(-1.4, 3.0, -.3), 40);
    } },
  { desde: 39, nombre: 'sacaban plata gratis: aparece el lingote', esc: 'noche', f(k, t) {
      noche.preparar({ tiempo: t, llenado: 1, lingoteK: clamp(k * 2.2) });
      cam(noche.cam, v3(lerp(.2, -.2, k), lerp(3.8, 3.6, k), lerp(4.4, 3.8, k)), v3(-.2, 2.9, .2), 44);
    } },
  { desde: 42, nombre: 'la solución: llega el rodillo', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, visibles: { lisa: [0, 0, 0, 0, .35] }, rodilloK: 0, grabado: 0 });
      cam(macro.cam, v3(lerp(3.4, 2.8, k), lerp(1.4, 1.0, k), lerp(4, 3.4, k)), v3(.8, .3, 0), 40);
    } },
  { desde: 44, nombre: 'grabar rayas en el borde: las estrías aparecen', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, visibles: { lisa: [0, 0, 0, k * Math.PI * 2, .35] }, rodilloK: k, grabado: k });
      cam(macro.cam, v3(lerp(2.2, 1.9, k), lerp(.6, .5, k), lerp(2.6, 2.3, k)), v3(.9, 0, 0), 38);
    } },
  { desde: 49, nombre: 'si alguien limaba la moneda: dos monedas', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, visibles: { rayada: [-1.15, 0, 0, .3, .6], limada: [1.15, 0, 0, .3, .6] }, lima: [2.2, .2, 0, -.1 + Math.sin(t * 22) * .05], chispasK: t });
      cam(macro.cam, v3(0, lerp(2.4, 2.0, k), lerp(6.2, 5.6, k)), v3(0, 0, 0), 44);
    } },
  { desde: 54, nombre: 'las rayas desaparecían y la delataban: alarma roja', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, visibles: { limada: [0, 0, 0, lerp(.3, .55, k), .6] }, alarmaK: suave(k * 2) });
      cam(macro.cam, v3(lerp(2.0, 1.6, k), lerp(1.6, 1.3, k), lerp(2.6, 2.2, k)), v3(.6, .5, 0), 40);
    } },
  { desde: 60, nombre: 'la Casa de la Moneda de Inglaterra (grúa)', esc: 'ceca', f(k, t) {
      ceca.preparar({ tiempo: t });
      cam(ceca.cam, v3(lerp(-3, 2, k), lerp(14, 6, suave(k)), lerp(18, 15, k)), v3(0, lerp(10, 6, k), -4), 50);
    } },
  { desde: 69, nombre: 'perseguía a los falsificadores: el falsificador se escabulle', esc: 'ceca', f(k, t) {
      ceca.preparar({ tiempo: t, quienes: [['fals', v3(lerp(-5, -1, k), 0, 1.2)]] });
      cam(ceca.cam, v3(lerp(-6, -3, k), 3.4, 9), v3(lerp(-3.5, -1, k), 2.6, 0), 46);
    } },
  { desde: 76, nombre: '¡Isaac Newton! se abre la puerta', esc: 'ceca', f(k, t) {
      ceca.preparar({ tiempo: t, puerta: salida(k * 2), quienes: [['newton', v3(0, 0, lerp(-4.4, -2.6, salida(k * 1.5)))]] });
      cam(ceca.cam, v3(0, lerp(3, 3.2, k), lerp(8, 6.2, k)), v3(0, 2.6, -3), 44);
    } },
  { desde: 78, nombre: 'tardó años: Newton señala, el falsificador corre', esc: 'ceca', f(k, t) {
      ceca.preparar({ tiempo: t, puerta: 1, quienes: [['newtonE', v3(-1.5, 0, -1.2)], ['fals', v3(lerp(1.4, 3.2, k), 0, 1.2)]] });
      cam(ceca.cam, v3(lerp(-1, 0, k), 3.2, lerp(10, 9, k)), v3(.8, 2.4, 0), 48);
    } },
  { desde: 81, nombre: 'atrapó al más famoso: ¡cae la reja!', esc: 'ceca', f(k, t) {
      ceca.preparar({ tiempo: t, puerta: 1, quienes: [['newtonE', v3(-1.5, 0, -1.2)], ['falsP', v3(3.2, 0, 1.2)]], reja: clamp((t - T(81)) / .35) });
      cam(ceca.cam, v3(lerp(5.2, 4.8, k), lerp(3.4, 3.2, k), lerp(8.4, 7.6, k)), v3(2.6, 2.4, 0), 46);
    } },
  { desde: 85, nombre: 'hoy las monedas ya no son de plata: Toni', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, toniK: true });
      cam(macro.cam, v3(lerp(.5, .2, k), lerp(-1.6, -1.8, k), lerp(9, 8, k)), v3(-.6, -2.0, -1.2), 44);
    } },
  { desde: 93, nombre: 'pero las rayas siguen ahí: moneda de oro acercándose', esc: 'macro', f(k, t) {
      macro.preparar({ tiempo: t, visibles: { oro: [0, 0, 0, t * .9, lerp(.1, .35, k)] } });
      cam(macro.cam, v3(lerp(3.0, 2.1, suave(k)), lerp(1.2, .55, k), lerp(5, 2.9, suave(k))), v3(lerp(0, .6, k), 0, 0), 40);
    } },
  { desde: 98, nombre: 'BUCLE: por culpa de unos ladrones (mismo plano que el inicio)', esc: 'macro', f(k, t) {
      // la lima entra al final: el siguiente fotograma es el primero del vídeo
      const entra = suave(clamp((k - .55) / .45)), tl = t - DURACION;
      macro.preparar({ tiempo: t, visibles: { oro: [0, 0, 0, 0, 0, giroCanto(tl)] }, lima: entra > 0 ? [1.02 + (1 - entra) * 1.6, .05 + (1 - entra) * .7, 0, -.1] : null });
      cam(macro.cam, v3(lerp(2.4, 2.0, k), .45, lerp(1.4, 1.15, k)), v3(.85, .05, 0), 40);
    } },
];
PLANOS.forEach((p, i) => { p.t0 = i === 0 ? 0 : T(p.desde) - .06; });
PLANOS.forEach((p, i) => { p.t1 = i + 1 < PLANOS.length ? PLANOS[i + 1].t0 : DURACION; });
const ESC = { macro, noche, mercado, ceca };

// =================== SUBTÍTULOS EN BLOQUES DE 2-4 PALABRAS ===================
const INICIO_SUB = 8;            // las palabras 0-7 son el gancho (texto grande)
const unidades = PAL.map((p, i) => ({ w: p.w, t0: p.t0, t1: p.t1, i })).filter(u => u.i >= INICIO_SUB);
const finFrase = w => /[.,:;…!?]$/.test(w);
const frases = []; let f0 = [];
unidades.forEach((u, j) => { f0.push(u); if (finFrase(u.w) || j === unidades.length - 1) { frases.push(f0); f0 = []; } });
for (let i = 0; i < frases.length; i++) if (frases[i].length === 1) {
  const prev = frases[i - 1], ant = prev && !/[.:…!?]$/.test(prev[prev.length - 1].w);
  if (ant) { prev.push(...frases[i]); frases.splice(i, 1); i--; } else if (frases[i + 1]) { frases[i + 1].unshift(...frases[i]); frases.splice(i, 1); i--; } else if (prev) { prev.push(...frases[i]); frases.splice(i, 1); i--; }
}
const bloques = [];
frases.forEach(fr => { const n = fr.length, k = Math.ceil(n / 4); let i = 0; for (let b = 0; b < k; b++) { const tam = Math.floor(n / k) + (b < n % k ? 1 : 0); bloques.push(fr.slice(i, i + tam)); i += tam; } });
const CLAVE = new Set(['plata', 'limaba', 'borde', 'virutas', 'gratis', 'solución', 'rayas', 'delataban', 'Moneda', 'falsificadores', 'Isaac', 'Newton', 'famoso', 'ladrones', 'Nadie']);
const marcar = w => w.split(' ').map(p => CLAVE.has(p.replace(/[^\wáéíóúñü]/gi, '')) ? `<b>${p}</b>` : p).join(' ');
const FIN_GANCHO = T(INICIO_SUB) - .06;

// =================== EDICIÓN ===================
const golpes = [T(81) + .32, T(76)];
const $ = id => document.getElementById(id);
function edicion(t) {
  const g = $('gancho'); g.style.opacity = t < FIN_GANCHO ? 1 : 0; g.style.transform = `scale(${lerp(1.1, 1, salida(t / .25))})`;
  const sub = $('sub');
  const b = t >= FIN_GANCHO ? bloques.find((bl, i) => bl[0].t0 - .05 <= t && t < (bloques[i + 1]?.[0].t0 ?? DURACION) - .05) : null;
  if (b) { sub.innerHTML = marcar(b.map(u => u.w.replace('…', '...')).join(' ')); const k = clamp((t - b[0].t0) / .1); sub.style.transform = `scale(${lerp(1.18, 1, salida(k))})`; sub.style.opacity = 1; } else sub.style.opacity = 0;
  $('flash').style.opacity = [[T(39) + .15, .4], [T(76), .35]].reduce((a, [ti, f]) => Math.max(a, t >= ti ? f * clamp(1 - (t - ti) / .22) : 0), 0);
  $('rojo').style.opacity = t >= T(54) - .06 && t < T(60) - .06 ? clamp((t - T(54)) / .3) * (.5 + .3 * Math.sin(t * 10)) : 0;
  let escala = 1; for (const p of PLANOS) { const d = t - p.t0; if (d >= 0 && d < .25) escala = Math.max(escala, lerp(1.06, 1, salida(d / .25))); }
  let sx = 0, sy = 0; for (const gp of golpes) { const d = t - gp; if (d >= 0 && d < .35) { const a = (1 - d / .35) * 20; sx += Math.sin(d * 90) * a; sy += Math.cos(d * 77) * a; } }
  $('lienzo').style.transform = `translate(${sx}px,${sy}px) scale(${escala * 1.03})`;
}

window.DURACION = DURACION;
window.PLANOS = PLANOS.map(p => ({ nombre: p.nombre, t0: p.t0, t1: p.t1, esc: p.esc }));
window.BLOQUES = bloques.map(b => b.map(u => u.w).join(' '));
window.renderAt = (t) => {
  const p = PLANOS.find(p => t >= p.t0 && t < p.t1) || PLANOS[PLANOS.length - 1];
  const k = clamp((t - p.t0) / (p.t1 - p.t0));
  p.f(k, t);
  const s = ESC[p.esc]; s.cam.aspect = W / H; s.cam.updateProjectionMatrix();
  rp.scene = s.escena; rp.camera = s.cam;
  renderer.toneMappingExposure = p.esc === 'noche' ? .95 : .9;
  bloom.strength = p.desde === 85 ? 0 : p.esc === 'macro' ? .25 : .18;
  comp.render(); edicion(t);
};
await Promise.all(CARGAS);
window.LISTO = true;
</script>
