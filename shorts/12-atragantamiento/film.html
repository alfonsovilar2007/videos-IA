function crearGarganta() {
  const e = new THREE.Scene(); e.environment = ESTUDIO;
  const fondo = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { peligro: { value: 0 } }, vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }', fragmentShader: 'uniform float peligro; varying vec3 p; void main(){ vec3 d = normalize(p); float k = clamp(d.z*.5+.5,0.,1.); vec3 a = mix(vec3(.02,.05,.16), vec3(.1,.28,.62), pow(k,2.)); vec3 b = mix(vec3(.18,.02,.02), vec3(.7,.12,.08), pow(k,2.)); gl_FragColor = vec4(mix(a,b,peligro),1.); }' }));
  fondo.material.userData.sinProf = true; e.add(fondo);
  e.add(new THREE.HemisphereLight('#ffe0e0', '#402020', .8)); const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(3, 6, 6); e.add(key);
  // tubo (vía respiratoria) translúcido con anillos
  const tubo = new THREE.Mesh(new THREE.CylinderGeometry(.55, .5, 7, 40, 1, true), new THREE.MeshPhysicalMaterial({ color: '#ff9a9a', transmission: .5, roughness: .25, transparent: true, opacity: .45, side: THREE.DoubleSide })); e.add(tubo);
  for (let i = 0; i < 12; i++) { const a = new THREE.Mesh(new THREE.TorusGeometry(.56, .05, 8, 40), new THREE.MeshStandardMaterial({ color: '#ffd0c8', roughness: .5 })); a.rotation.x = Math.PI / 2; a.position.y = -3.2 + i * .55; e.add(a); }
  // el trozo de comida
  const trozo = new THREE.Mesh(new THREE.DodecahedronGeometry(.42, 1), new THREE.MeshStandardMaterial({ color: '#c8862e', roughness: .7, emissive: '#ff2a00', emissiveIntensity: 0 })); trozo.scale.set(1, .8, 1); e.add(trozo);
  // aire: partículas que suben y bajan
  const nA = 160, aPos = new Float32Array(nA * 3), aGeo = new THREE.BufferGeometry(); aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
  const aire = new THREE.Points(aGeo, new THREE.PointsMaterial({ color: '#bfe8ff', size: .09, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, map: BRILLO })); e.add(aire);
  const dA = [...Array(nA)].map(() => [rnd(), rnd() * 6.28, rnd()]);
  // dedo que empuja
  const dedo = new THREE.Mesh(new THREE.CapsuleGeometry(.22, 1.6, 8, 16), new THREE.MeshStandardMaterial({ color: '#f6d8b8', roughness: .6 })); e.add(dedo);
  const cam = new THREE.PerspectiveCamera(40, W / H, .1, 300);
  return {
    escena: e, cam,
    // modo: 'pasa' (el aire pasa), 'golpe' (baja y tapa), 'dedo' (lo empuja), 'tos' (sube)
    preparar({ tiempo: t, modo = 'pasa', k = 0 }) {
      CAMARA = cam; let y = 1.6, flujo = 1, peligro = 0;
      if (modo === 'golpe') { y = lerp(1.6, -.6, suave(k * 1.4)); flujo = 1 - suave(k * 1.6); peligro = suave(k * 1.5); trozo.scale.set(1.25, .8, 1.25); }
      else if (modo === 'dedo') { y = lerp(1.6, -.4, suave((k - .2) * 1.6)); flujo = 1 - suave(k * 1.6); peligro = suave(k * 1.5); trozo.scale.set(1.25, .8, 1.25); }
      else if (modo === 'tos') { y = lerp(1.2, 4.6, suave((k - .3) * 2)); flujo = 1.6; trozo.scale.set(1, .8, 1); }
      else trozo.scale.set(1, .8, 1);
      trozo.position.set(Math.sin(t * 7) * .03, y + Math.sin(t * 13) * .02, 0); trozo.rotation.set(t * .3, t * .5, 0); trozo.material.emissiveIntensity = peligro * .4;
      fondo.material.uniforms.peligro.value = peligro;
      dedo.visible = modo === 'dedo'; dedo.position.set(0, y + 1.5, 0);
      const dir = modo === 'tos' ? 1 : (Math.sin(t * 1.6) > 0 ? 1 : -1);
      dA.forEach((d, i) => { const ph = (d[0] + t * .6 * dir * flujo) % 1, yy = -3 + ((ph + 1) % 1) * 6; const r = .1 + d[2] * .3; aPos.set([Math.cos(d[1]) * r, yy, Math.sin(d[1]) * r], i * 3); }); aGeo.attributes.position.needsUpdate = true;
      aire.material.opacity = clamp(flujo) * .9;
    },
  };
}

const CLAVES = [[0, 'si alguien se atraganta', 'b'], [7, 'lo peor que puedes hacer', 'r'], [13, 'golpes en la espalda', 'r'], [18, 'el aire pasa', 'a'], [24, 'el trozo baja más', 'r'], [36, 'lo segundo', 'b'], [38, 'los dedos', 'r'], [44, 'lo empujas dentro', 'r'], [51, 'anímale a toser', 'a'], [55, null], [58, 'la tos funciona', 'a'], [65, 'no puede respirar', 'r'], [75, 'llama al 112', 'a'], [79, 'inclínale', 'a'], [87, '5 golpes', 'a'], [94, 'ponte detrás', 'a'], [99, 'el puño', 'a'], [104, '5 compresiones', 'a'], [112, '5 y 5', 'a'], [118, 'lo que casi nadie sabe', 'b'], [125, 'si estás solo', 'a'], [132, 'contra una silla', 'a'], [138, 'si se desmaya', 'r'], [142, 'reanimación', 'a'], [150, null], [155, 'no golpes si tose', 'm'], [162, 'no los dedos', 'm'], [167, 'que tosa', 'm'], [175, '5 golpes + 5 compresiones', 'm'], [180, 'recuérdalo', 'm']];
const COLOR = { r: '#FF4A3D', a: '#FFD93B', m: '#C59BFF', b: '#FFFFFF' };
const BURBUJAS = [[T(6), T(18) - .1, '*cof, cof*', 'tos'], [T(55), T(58) - .1, '¡Tose! ¡Tose fuerte!', 'toni'], [T(76), T(79) - .1, '¡112, rápido!', 'toni'], [T(150), T(155) - .1, '¡Me has salvado!', 'amiga'], [T(65), T(75) - .1, '…', 'amiga2']];
const EQUIS = [[T(13) + .2, T(18) - .1], [T(39), T(44) - .1], [T(158), T(167) - .1]];

// =================== EDICIÓN ===================
const $ = id => document.getElementById(id);
const golpes = [[0, 40], [T(65), 10], [T(87), 6], [T(105), 6]];
const granoCanvas = document.createElement('canvas'); granoCanvas.width = granoCanvas.height = 256;
{ const g = granoCanvas.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
$('grano').style.backgroundImage = `url(${granoCanvas.toDataURL()})`;
const proyectar = (p, cam) => { const v = p.clone().project(cam); return [(v.x * .5 + .5) * W, (-v.y * .5 + .5) * H, v.z < 1]; };
function edicion(t, cam) {
  // palabra clave
  const c = [...CLAVES].reverse().find(([i]) => T(i) - .05 <= t); const cl = $('clave');
  if (c && c[1]) { cl.textContent = c[1]; cl.style.color = COLOR[c[2]]; const k = clamp((t - T(c[0])) / .12); cl.style.transform = `scale(${lerp(1.25, 1, salida(k))})`; cl.style.opacity = 1; } else cl.style.opacity = 0;
  // bocadillos
  const bz = $('burbujas'); bz.innerHTML = '';
  for (const [a, b, txt, ancla] of BURBUJAS) { if (t < a || t >= b) continue; const base = ancla === 'tos' ? ANCLAS.tos : ancla === 'toni' ? ANCLAS.toni : ancla === 'amiga' ? ANCLAS.amiga : ANCLAS.tos; if (!base) continue; const [x, y, ok] = proyectar(base.clone().add(v3(0, .38, 0)), cam); if (!ok) continue; const d = document.createElement('div'); d.className = 'burbuja'; d.textContent = txt; const k = clamp((t - a) / .15); d.style.left = clamp(x, 260, W - 260) + 'px'; d.style.top = clamp(y, 420, H - 300) + 'px'; d.style.transform = `translate(-50%,-100%) scale(${lerp(.4, 1, salida(k))})`; bz.appendChild(d); }
  // X roja
  const eq = $('equis'); const ex = EQUIS.find(([a, b]) => t >= a && t < b);
  if (ex && ANCLAS.equis) { const [x, y] = proyectar(ANCLAS.equis, cam); const k = clamp((t - ex[0]) / .15); eq.style.left = x + 'px'; eq.style.top = y + 'px'; eq.style.opacity = 1; eq.style.transform = `translate(-50%,-50%) scale(${lerp(1.6, 1, salida(k))}) rotate(${lerp(-20, 0, salida(k))}deg)`; } else eq.style.opacity = 0;
  // contador 1..5
  const ct = $('contador'); let cc = { n: 0 }; for (const r of [GOLPES, COMPRES]) { const q = cinco(t, ...r); if (q.n) cc = q; }
  if (cc.n && ANCLAS.cuenta) { const [x, y] = proyectar(ANCLAS.cuenta, cam); ct.textContent = cc.n; ct.style.left = x + 'px'; ct.style.top = y + 'px'; ct.style.opacity = 1; ct.style.transform = `translate(-50%,-50%) scale(${lerp(1.5, 1, salida(cc.f * 4))})`; } else ct.style.opacity = 0;
  $('flash').style.opacity = [[0, 1, .35]].reduce((a, [ti, f, d]) => Math.max(a, t >= ti ? f * clamp(1 - (t - ti) / d) : 0), 0);
  let escala = 1, barrido = 0; for (const p of PLANOS) { const d = t - p.t0; if (d >= 0 && d < .25) { escala = Math.max(escala, lerp(1.06, 1, salida(d / .25))); if (BARRIDOS.has(p.desde) && d < .18) barrido = 1 - d / .18; } }
  let sx = 0, sy = 0; for (const [gp, fuerza] of golpes) { const d = t - gp; if (d >= 0 && d < .6) { const a = Math.pow(1 - d / .6, 2) * fuerza; sx += Math.sin(d * 90) * a; sy += Math.cos(d * 77) * a; } }
  for (const r of [GOLPES, COMPRES]) { const q = cinco(t, ...r); if (q.n && q.f < .25) { sx += Math.sin(q.f * 60) * 6 * (1 - q.f * 4); } }
  sx += barrido * barrido * 280;
  const lz = $('lienzo'); lz.style.transform = `translate(${sx}px,${sy}px) scale(${escala * 1.04})`; lz.style.filter = barrido > 0 ? `blur(${(barrido * 10).toFixed(1)}px)` : 'none';
  $('grano').style.backgroundPosition = `${Math.floor(t * 30 * 97) % 256}px ${Math.floor(t * 30 * 53) % 256}px`;
}

window.DURACION = DURACION;
window.PLANOS = PLANOS.map(p => ({ nombre: p.nombre, t0: p.t0, t1: p.t1, esc: p.esc, desde: p.desde }));
window.renderAt = (t) => {
  const p = PLANOS.find(p => t >= p.t0 && t < p.t1) || PLANOS[PLANOS.length - 1];
  const k = clamp((t - p.t0) / (p.t1 - p.t0));
  const s = ESC[p.esc]; FOCO = null; ANCLAS = {}; p.f(k, t); p.f(k, t);
  s.cam.aspect = W / H; s.cam.updateProjectionMatrix(); s.cam.updateMatrixWorld();
  rp.scene = s.escena; rp.camera = s.cam; dof.escena = s.escena; dof.cam = s.cam;
  if (FOCO) { dof.foco = -FOCO.clone().applyMatrix4(s.cam.matrixWorldInverse).z; dof.apertura = .005; } else dof.apertura = 0;
  renderer.toneMappingExposure = 1.0;
  if (window.ANTES) window.ANTES(t);
  comp.render(); edicion(t, s.cam);
};
await Promise.all(CARGAS);
window.LISTO = true;
</script>
