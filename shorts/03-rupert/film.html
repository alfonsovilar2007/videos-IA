// ---------- la gota (lágrima del príncipe Rupert): cabeza en x=0, cola hacia +x ----------

// Estallido: partículas que salen al pasar el frente de la grieta (de la cola a la cabeza)

// =================== ESCENARIO 1: TALLER ===================

  const cabeza = new THREE.Mesh(new THREE.BoxGeometry(1.1, .5, .5), new THREE.MeshStandardMaterial({ color: '#9aa3ad', metalness: .9, roughness: .25 })); cabeza.position.set(0, 3.2, 0); cabeza.castShadow = true;
  martillo.add(mango, cabeza);
  // alicates
  const alicates = new THREE.Group(); e.add(alicates);
  const rojo = new THREE.MeshStandardMaterial({ color: '#D9534F', roughness: .5 }), acero = new THREE.MeshStandardMaterial({ color: '#b9c1c9', metalness: .9, roughness: .2 });
  const brazoA = new THREE.Group(), brazoB = new THREE.Group(); alicates.add(brazoA, brazoB);
  for (const [b, s] of [[brazoA, 1], [brazoB, -1]]) { const m = new THREE.Mesh(new THREE.BoxGeometry(.12, 1.6, .1), rojo); m.position.set(0, -.85, 0); const j = new THREE.Mesh(new THREE.BoxGeometry(.1, .45, .08), acero); j.position.set(0, .22, 0); b.add(m, j); }
  // chispas del martillazo

  const chispas = new THREE.Points(chG, new THREE.PointsMaterial({ color: '#FFC24A', size: .14, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, map: texRadial('rgba(255,220,120,1)') })); e.add(chispas);
  const chV = [...Array(nCh)].map(() => v3((rnd() - .5) * 6, 2 + rnd() * 5, (rnd() - .5) * 6));
  // horno de vidrio y cubo de agua
  const ladrillo = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#7a2e1e'; g.fillRect(0, 0, w, h); g.fillStyle = '#B4462E'; for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 * 32; x < w; x += 64) g.fillRect(x + 3, y + 3, 58, 26); }, 2, 2);
  caja(3.6, 4.4, 3, new THREE.MeshStandardMaterial({ map: ladrillo, roughness: .9 }), 8, 2.2, -3);
  const boca = new THREE.Mesh(new THREE.CircleGeometry(.9, 32), new THREE.MeshBasicMaterial({ color: '#FFB347' })); boca.position.set(8, 2.4, -1.49); e.add(boca);
  const fuego = new THREE.PointLight('#ff8a2a', 80, 14, 1.5); fuego.position.set(8, 2.4, -.6); e.add(fuego);
  const cubo = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1, 1.5, 32, 1, true), new THREE.MeshStandardMaterial({ color: '#3B82C4', metalness: .5, roughness: .3, side: THREE.DoubleSide })); cubo.position.set(8, .75, 1.2); cubo.castShadow = true; e.add(cubo);

  const gotaFundida = new THREE.Mesh(new THREE.SphereGeometry(.22, 24, 16), new THREE.MeshBasicMaterial({ color: '#FF8C1A' })); e.add(gotaFundida);
  const brilloFundido = new THREE.Sprite(new THREE.SpriteMaterial({ map: texRadial('rgba(255,140,30,1)'), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); brilloFundido.scale.setScalar(1.4); e.add(brilloFundido);

  e.add(new THREE.HemisphereLight('#bfe8ff', '#6a3a1a', .7));

// =================== ESCENARIO 2: ESTUDIO (macro de la gota) ===================
function crearEstudio() {

  const cian = new THREE.PointLight('#4fe3ff', 60, 30, 1.4); cian.position.set(8, -2, 4); e.add(cian);
  // todo lo de la gota va en un pivote girado para que quede de pie (vídeo vertical)
  const pivote = new THREE.Group(); pivote.rotation.z = Math.PI / 2 - .22; pivote.position.set(0, -3.2, 0); e.add(pivote);
  // gota entera de cristal

  const corte = new THREE.Plane(v3(-1, 0, 0), 999); gota.material.clippingPlanes = [corte];
  const cortar = f => { gota.updateMatrixWorld(true); corte.set(v3(-1, 0, 0), f).applyMatrix4(gota.matrixWorld); };
  const est = crearEstallido(pivote, 1, 900);
  const frente = new THREE.Sprite(new THREE.SpriteMaterial({ map: texRadial('rgba(255,255,255,1)'), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); pivote.add(frente);
  // gota cortada por la mitad: capa exterior (azul) y núcleo (rojo)
  const mitad = new THREE.Plane(v3(0, 0, -1), 0);
  const capa = new THREE.Mesh(geoGota(1), new THREE.MeshStandardMaterial({ color: '#cfeeff', roughness: .2, metalness: .1, side: THREE.DoubleSide, clippingPlanes: [mitad], emissive: '#1a6fff', emissiveIntensity: 0 }));
  const nucleo = new THREE.Mesh(geoGota(.62), new THREE.MeshStandardMaterial({ color: '#ff3b2f', roughness: .4, side: THREE.DoubleSide, clippingPlanes: [mitad], emissive: '#ff2a00', emissiveIntensity: .6 }));
  nucleo.position.x = -.05; pivote.add(capa, nucleo);
  // flechas que tiran hacia dentro (cabeza) y se amontonan en la cola
  const anillo = [...Array(12)].map((_, i) => { const f = flecha(.55, .05); f.userData.a = i / 12 * Math.PI * 2; pivote.add(f); return f; });
  const cola = [...Array(10)].map((_, i) => { const f = flecha(.45, .04); f.userData.x = .8 + i * .55; f.userData.s = i % 2 ? 1 : -1; pivote.add(f); return f; });
  const peligro = new THREE.Sprite(new THREE.SpriteMaterial({ map: texRadial('rgba(255,40,30,1)'), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); pivote.add(peligro);

  return {
    escena: e, cam, W: (x, y, z) => pivote.localToWorld(v3(x, y, z)),
    preparar({ tiempo, modo = 'entera', frio = 0, encoge = 0, flechasK = 0, colaK = 0, rotura = -1, giro = 0, oro = 0, peligroK = 0 }) {

      const s = 1 - encoge * .12; nucleo.scale.set(s, s, s); nucleo.material.emissiveIntensity = .6 + Math.sin(tiempo * 6) * .15;

      cola.forEach((f, i) => { f.visible = colaK > 0 && !entera; const x = f.userData.x, y0 = Math.pow(x / L, 2) * .6; const r = .9 * Math.pow(1 - x / L, 1.6) + .35; f.position.set(x, y0 + f.userData.s * r * (1 + Math.sin(tiempo * 7 + i) * .08), .2); f.rotation.z = f.userData.s > 0 ? Math.PI : 0; f.scale.setScalar(colaK * (.6 + i * .06)); });
      peligro.visible = peligroK > 0; peligro.position.set(L - .2, .6, .2); peligro.scale.setScalar((1 + Math.sin(tiempo * 12) * .3) * peligroK * 1.6);

      if (rotura >= 0) { const f = xCola - rotura * vel; cortar(f); gota.visible = entera && f > xCab; est.set(f, x => rotura - (xCola - x) / vel); frente.visible = f > xCab; frente.position.set(f, f > 0 ? (f / L) ** 2 * .6 : 0, 0).applyEuler(gota.rotation); frente.scale.setScalar(f > 0 ? 1.4 : 2.6); }

    },
  };
}

      camT(G.clone().add(v3(lerp(2.1, 1.7, k), lerp(1.3, 1.1, k), lerp(6.2, 5.4, k))), G.clone().add(v3(.1, .45, 0)), 42);

PLANOS.forEach((p, i) => { p.t0 = i === 0 ? 0 : T(p.desde) - .06; });
PLANOS.forEach((p, i) => { p.t1 = i + 1 < PLANOS.length ? PLANOS[i + 1].t0 : DURACION; });
const ESC = { taller, estudio, palacio };

// =================== SUBTÍTULOS EN BLOQUES DE 2-4 PALABRAS ===================
// Unidades: palabras de la voz, con números escritos en cifras (no se repiten rótulos en pantalla)
const unidades = []; for (let i = 0; i < PAL.length; i++) {
  if (i === 84) { unidades.push({ w: '6.000 km/h.', t0: PAL[84].t0, t1: PAL[88].t1 }); i = 88; continue; }
  if (i === 104) { unidades.push({ w: '350', t0: PAL[104].t0, t1: PAL[105].t1 }); i = 105; continue; }
  unidades.push({ w: PAL[i].w, t0: PAL[i].t0, t1: PAL[i].t1, i });
}
const finFrase = w => /[.,:;…!?]$/.test(w);
const cuerpo = unidades.filter(u => u.i === undefined || u.i >= 5);           // las palabras del gancho van en grande, no como subtítulo
const frases = []; let f0 = [];
cuerpo.forEach((u, j) => { f0.push(u); if (finFrase(u.w) || j === cuerpo.length - 1) { frases.push(f0); f0 = []; } });
// frases de 1 palabra: se unen a la anterior si no es final de oración; si no, a la siguiente
for (let i = 0; i < frases.length; i++) if (frases[i].length === 1) {
  const prev = frases[i - 1], ant = prev && !/[.:…!?]$/.test(prev[prev.length - 1].w);
  if (ant) { prev.push(...frases[i]); frases.splice(i, 1); i--; } else if (frases[i + 1]) { frases[i + 1].unshift(...frases[i]); frases.splice(i, 1); i--; } else if (prev) { prev.push(...frases[i]); frases.splice(i, 1); i--; }
}
const bloques = [];
frases.forEach(fr => { const n = fr.length, k = Math.ceil(n / 4); let i = 0; for (let b = 0; b < k; b++) { const tam = Math.floor(n / k) + (b < n % k ? 1 : 0); bloques.push(fr.slice(i, i + tam)); i += tam; } });
const CLAVE = new Set(['martillazo', 'pellizco', 'Rupert', 'fundido', 'helada', 'rígido', 'caliente', 'encoge', 'puño', 'martillazos', 'cola', 'tensión', 'punta', 'grieta', '6.000', 'km/h', '1661', 'científicos', '350', 'indestructible']);
const marcar = w => w.split(' ').map(p => CLAVE.has(p.replace(/[^\wáéíóúñü.\/0-9]/gi, '').replace(/\.$/, '')) ? `<b>${p}</b>` : p).join(' ');
const FIN_GANCHO = T(5) - .06;   // el gancho grande ocupa los primeros ~1,8 s (no se repite como subtítulo)

// =================== CAPA DE EDICIÓN ===================
const golpes = [0, T(7) - .2, T(58), T(58) + .5, T(58) + 1.0, T(81) + .72];
const $ = id => document.getElementById(id);
function edicion(t) {
  const g = $('gancho'); g.style.opacity = t < FIN_GANCHO ? 1 : 0; g.style.transform = `scale(${lerp(1.12, 1, salida(t / .25))})`;
  const sub = $('sub');
  const b = t >= FIN_GANCHO ? bloques.find((bl, i) => bl[0].t0 - .05 <= t && t < (bloques[i + 1]?.[0].t0 ?? DURACION) - .05) : null;
  if (b) { sub.innerHTML = marcar(b.map(u => u.w.replace('…', '...')).join(' ')); const k = clamp((t - b[0].t0) / .1); sub.style.transform = `scale(${lerp(1.18, 1, salida(k))})`; sub.style.opacity = 1; } else sub.style.opacity = 0;
  $('flash').style.opacity = [[T(6) + .62, .55], [T(81) + .72, .6]].reduce((a, [ti, f]) => Math.max(a, t >= ti ? f * clamp(1 - (t - ti) / .22) : 0), 0);
  let escala = 1; for (const p of PLANOS) { const d = t - p.t0; if (d >= 0 && d < .25) escala = Math.max(escala, lerp(1.06, 1, salida(d / .25))); }
  let sx = 0, sy = 0; for (const gp of golpes) { const d = t - gp; if (d >= 0 && d < .35) { const a = (1 - d / .35) * 20; sx += Math.sin(d * 90) * a; sy += Math.cos(d * 77) * a; } }
  $('lienzo').style.transform = `translate(${sx}px,${sy}px) scale(${escala * 1.03})`;
}

window.DURACION = DURACION;
window.PLANOS = PLANOS.map(p => ({ nombre: p.nombre, t0: p.t0, t1: p.t1, esc: p.esc }));
window.BLOQUES = bloques.map(b => b.map(u => u.w).join(' '));
window.renderAt = (t) => {
  const p = PLANOS.find(p => t >= p.t0 && t < p.t1) || PLANOS[PLANOS.length - 1];
  const k = clamp((t - p.t0) / (p.t1 - p.t0));
  p.f(k, t);
  const s = ESC[p.esc]; s.cam.aspect = W / H; s.cam.updateProjectionMatrix();
  rp.scene = s.escena; rp.camera = s.cam;
  renderer.toneMappingExposure = p.esc === 'estudio' ? .9 : .85;
  bloom.strength = p.esc === 'estudio' ? .25 : .15;
  comp.render(); edicion(t);
};
await Promise.all(CARGAS);
window.LISTO = true;
