<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#F4EFE6;font-family:"DejaVu Sans",sans-serif}</style></head><body>
<svg id="s" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../personajes/personajes.js"></script>
<script>
let h = `<rect width="1600" height="1000" fill="#F4EFE6"/>
<text x="50" y="78" font-size="40" font-weight="700" fill="${INK}">Personajes · "El cristal que un martillo no puede romper"</text>
<text x="50" y="118" font-size="22" fill="#5B6478">Mismo estilo del canal · Toni (la mascota) hace las pruebas · el rey Carlos II y los científicos de la Royal Society (1661)</text>`;
const fichas = [
  ['toni_martillo', 'Toni con el martillo', 'Golpea y golpea… y suda.', 'La gota ni se inmuta.'],
  ['toni_alicates', 'Toni con los alicates', 'Un pellizco en la cola', 'y la gota estalla.'],
  ['rey', 'El rey Carlos II', 'Peluca negra, corona y capa', 'roja. Entrega la gota.'],
  ['cientifico1', 'Científico 1', 'Peluca blanca, casaca azul.', 'Se rasca la cabeza.'],
  ['cientifico2', 'Científico 2', 'Peluca blanca, gafas y lupa.', 'No da crédito.'],
];
fichas.forEach((f, i) => { h += `<rect x="${30 + i * 310}" y="150" width="295" height="810" rx="26" fill="#fff" stroke="#E3DCCF" stroke-width="3"/>`; });
fichas.forEach(([p, nom, l1, l2], i) => {
  const x = 30 + i * 310;
  h += dibujar(p, x + 147, 790, .86);
  h += `<text x="${x + 147}" y="855" font-size="24" font-weight="700" text-anchor="middle" fill="${INK}">${nom}</text>`;
  h += `<text x="${x + 147}" y="890" font-size="17" text-anchor="middle" fill="#5B6478">${l1}</text>`;
  h += `<text x="${x + 147}" y="915" font-size="17" text-anchor="middle" fill="#5B6478">${l2}</text>`;
});
document.getElementById('s').innerHTML = h;
</script></body></html>
