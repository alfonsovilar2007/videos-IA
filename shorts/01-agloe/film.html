  { desde: 139, nombre: 'por culpa del mapa (el cruce vuelve a ser un punto)', esc: 'mapa', f(k, t) {
      mapa.preparar({ tiempo: t, punto: 1 });
      const c = mapa.cam; c.fov = 50; c.position.copy(pA.clone().add(v3(0, lerp(1.2, 16, salida(k)), lerp(.1, 4, k)))); c.lookAt(pA);
    } },
  { desde: 146, nombre: 'hoy: los mapas siguen escondiendo trampas', esc: 'mapa', f(k, t) {
      mapa.preparar({ tiempo: t, estilo: 'moderno', trampas: k * 1.6 });
      const c = mapa.cam; c.fov = 55; const a = lerp(-.3, .3, k);
      c.position.set(Math.sin(a) * 14, lerp(20, 17, k), Math.cos(a) * 14); c.lookAt(0, 0, 0);
    } },
];
PLANOS.forEach((p, i) => { p.t0 = i === 0 ? 0 : T(p.desde) - .06; });
PLANOS.forEach((p, i) => { p.t1 = i + 1 < PLANOS.length ? PLANOS[i + 1].t0 : DURACION; });
const ESC = { mapa, cruce, oficina };

// =================== CAPA DE EDICIÓN ===================
const CLAVE = new Set(['pueblo', 'existía', 'ladrones', 'verdad', 'tarde', 'trampa', 'falso', 'Agloe', 'copiado', 'pillado', 'creían', 'real', 'tienda', 'Tienda', 'inventó', 'trampas', 'alguna']);
const golpes = [T(4), T(29), T(41), T(87), T(90), T(102), T(127)];
const $ = id => document.getElementById(id);
// letras de AGLOE: salen de las iniciales de Otto G. Lindberg y Ernest Alpers
const letrasDiv = $('letras');
const LETRAS = [['A', 1, 1], ['G', 0, 1], ['L', 0, 2], ['O', 0, 0], ['E', 1, 0]];   // letra, grupo, posición en su grupo
letrasDiv.innerHTML = LETRAS.map(([l]) => `<span>${l}</span>`).join('') + '<span class="nombre" id="n0">Otto G. Lindberg</span><span class="nombre" id="n1">Ernest Alpers</span>';
const spans = [...letrasDiv.querySelectorAll('span')];
function edicion(t) {
  let i = -1; for (let j = 0; j < PAL.length; j++) if (PAL[j].t0 <= t + .02) i = j;
  const el = $('palabra');
  if (i >= 0 && t < PAL[i].t1 + .6) {
    const w = PAL[i].w, limpio = w.replace(/[^\wáéíóúñü]/gi, '');
    el.textContent = w.replace('…', '...'); el.style.color = CLAVE.has(limpio) ? '#FFD93B' : '#fff';
    const k = clamp((t - PAL[i].t0) / .09); el.style.transform = `scale(${lerp(1.28, 1, salida(k))})`; el.style.opacity = 1;
  } else el.style.opacity = 0;
  // sellos
  const s = $('sello'); s.style.opacity = 0;
  for (const [idx, txt, col, dur] of [[18, 'AÑOS 30', '#fff', 1.6], [41, 'TRAMPA', '#FF4D4D', 1.4], [87, '¡PILLADOS!', '#FFD93B', 1.2]]) {
    const d = t - T(idx);
    if (d > -.05 && d < dur) { s.textContent = txt; s.style.color = col; s.style.borderColor = col; s.style.opacity = clamp((dur - d) / .25); s.style.transform = `translateX(-50%) scale(${lerp(2.4, 1, salida(d / .16))}) rotate(-7deg)`; }
  }
  // animación de las letras (plano 51 a 60)
  const d0 = t - T(51), dTot = T(60) - .06 - T(51);
  letrasDiv.style.opacity = d0 > 0 && d0 < dTot ? 1 : 0;
  if (d0 > 0 && d0 < dTot) {
    const junta = suave(clamp((t - T(54)) / .7));   // en "mezclando" se juntan
    spans.slice(0, 5).forEach((sp, j) => {
      const [, gr, pos] = LETRAS[j];
      const x0 = 540 + (gr === 0 ? (pos - 1) * 190 : (pos - .5) * 190), y0 = gr === 0 ? 560 : 900;
      const x1 = 540 + (j - 2) * 175, y1 = 760;
      const ap = salida(clamp((d0 - j * .08) / .25));
      sp.style.left = lerp(x0, x1, junta) + 'px'; sp.style.top = lerp(y0, y1, junta) + 'px';
      sp.style.transform = `scale(${ap * (1 + Math.sin(junta * Math.PI) * .25)}) rotate(${(1 - junta) * (j % 2 ? 8 : -8)}deg)`;
    });
    $('n0').style.left = '540px'; $('n0').style.top = '760px'; $('n1').style.left = '540px'; $('n1').style.top = '1100px';
    $('n0').style.opacity = $('n1').style.opacity = 1 - junta;
  }
  $('flash').style.opacity = [[T(11) - .06, .5], [T(102) - .06, .45], [T(87), .3]].reduce((a, [ti, f]) => Math.max(a, t >= ti ? f * clamp(1 - (t - ti) / .25) : 0), 0);
  // "O eso creían": blanco y negro de golpe (interrupción de patrón)
  const bn = t >= T(90) - .06 && t < T(93) - .06;
  let escala = 1; for (const p of PLANOS) { const d = t - p.t0; if (d >= 0 && d < .3) escala = Math.max(escala, lerp(1.07, 1, salida(d / .3))); }
  let sx = 0, sy = 0; for (const g of golpes) { const d = t - g; if (d >= 0 && d < .4) { const a = (1 - d / .4) * 18; sx += Math.sin(d * 90) * a; sy += Math.cos(d * 77) * a; } }
  const lz = $('lienzo'); lz.style.transform = `translate(${sx}px,${sy}px) scale(${escala * 1.03})`; lz.style.filter = bn ? 'grayscale(1) contrast(1.15)' : 'none';
}

window.DURACION = DURACION;
window.PLANOS = PLANOS.map(p => ({ nombre: p.nombre, t0: p.t0, t1: p.t1, esc: p.esc }));
window.renderAt = (t) => {
  const p = PLANOS.find(p => t >= p.t0 && t < p.t1) || PLANOS[PLANOS.length - 1];
  const k = clamp((t - p.t0) / (p.t1 - p.t0));
  p.f(k, t);
  const s = ESC[p.esc]; s.cam.aspect = W / H; s.cam.updateProjectionMatrix();
  rp.scene = s.escena; rp.camera = s.cam;
  renderer.toneMappingExposure = p.esc === 'cruce' ? .85 : p.esc === 'oficina' ? .95 : .9;
  bloom.strength = p.esc === 'cruce' ? .25 : .1;
  comp.render(); edicion(t);
};
await Promise.all(CARGAS);
window.LISTO = true;
</script>
